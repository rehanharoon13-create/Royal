<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Inc — One-Time Login Setup</title>
<style>
  body{font-family:sans-serif;background:#1c1a16;color:#F5EFE0;padding:24px;max-width:480px;margin:0 auto;}
  h1{font-size:20px;color:#B8973A;}
  label{display:block;margin-top:16px;font-size:13px;color:#B8973A;text-transform:uppercase;letter-spacing:.05em;}
  input,select{width:100%;padding:12px;margin-top:6px;border-radius:6px;border:1px solid #444;background:#2a2620;color:#fff;font-size:16px;box-sizing:border-box;}
  button{width:100%;margin-top:24px;padding:14px;background:linear-gradient(135deg,#B8973A,#8A6E28);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em;}
  #result{margin-top:20px;padding:12px;border-radius:6px;font-size:14px;display:none;}
  .ok{background:rgba(94,140,106,.15);border:1px solid #5E8C6A;color:#5E8C6A;}
  .err{background:rgba(184,92,74,.15);border:1px solid #B85C4A;color:#B85C4A;}
</style>
</head>
<body>
<h1>One-Time Login Setup</h1>
<p style="font-size:13px;color:#999;">Use this once to create the FIRST director login, since the login table starts empty. After this, use "Manage Logins" inside the app itself for everyone else — delete this page once you're done.</p>

<label>Which director is this for?</label>
<select id="userId">
  <option value="haroon">Haroon sb</option>
  <option value="ahmad">Ahmad sb</option>
  <option value="rehan">Rehan sb</option>
</select>

<label>Choose a username</label>
<input id="username" type="text" placeholder="e.g. haroon" autocapitalize="none">

<label>Choose a password (min 4 characters)</label>
<input id="password" type="password" placeholder="Choose a strong password">

<button onclick="doSetup()">Create Login</button>

<div id="result"></div>

<script>
async function doSetup(){
  var userId = document.getElementById('userId').value;
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var resultEl = document.getElementById('result');
  resultEl.style.display='block';
  resultEl.className='';
  resultEl.textContent='Setting up...';

  if(!username || !password || password.length < 4){
    resultEl.className='err';
    resultEl.textContent='Enter a username and a password of at least 4 characters.';
    return;
  }

  try{
    var resp = await fetch('https://vqkzwnecokrioaizlsbq.supabase.co/functions/v1/royal-auth', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'set_password', username: username, password: password, user_id: userId})
    });
    var data = await resp.json();
    if(data.ok){
      resultEl.className='ok';
      resultEl.textContent='Success! Login created for '+userId+'. Username: '+username+'. You can now log into the app with these credentials, then use Manage Logins inside the app for everyone else.';
    } else {
      resultEl.className='err';
      resultEl.textContent='Failed: '+(data.error||'unknown error');
    }
  }catch(e){
    resultEl.className='err';
    resultEl.textContent='Could not reach the server: '+e.message;
  }
}
</script>
</body>
</html>
